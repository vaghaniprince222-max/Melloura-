<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart - Melloura Chocolates</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#25160e',
            'primary-container': '#3c2a21',
            secondary: '#885210',
            'secondary-container': '#fdb56c',
            tertiary: '#735c00',
            'tertiary-container': '#cca730',
            background: '#fdf9f6',
            surface: '#fdf9f6',
            'surface-container-low': '#f7f3f0',
            'surface-container': '#f1edea',
            'surface-container-high': '#ebe7e4',
            'surface-container-highest': '#e5e2df',
            'on-surface': '#1c1b1a',
            'on-surface-variant': '#4f4540',
            outline: '#81756f',
            'outline-variant': '#d3c3bd'
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="cart"
  class="bg-[#fdf9f6] text-[#1c1b1a] antialiased selection:bg-[#fdb56c] selection:text-[#25160e] pt-20 md:pt-24">

  <!-- Slim Sticky Header -->
  <header id="site-header"
    class="fixed top-0 left-0 w-full z-40 bg-[#fdf9f6]/95 backdrop-blur-md border-b border-[#d3c3bd]/60 shadow-[0px_4px_20px_rgba(37,22,14,0.04)] transition-all duration-300">
  </header>

  <!-- Main Cart Section -->
  <main class="w-full max-w-[1280px] mx-auto px-4 md:px-12 py-10 md:py-16">
    <div class="mb-8">
      <h1 class="font-serif text-3xl md:text-4xl text-[#25160e] font-bold mb-1">Your Shopping Bag</h1>
      <p class="font-sans text-xs text-[#4f4540]">Review your artisanal selections before proceeding to secure checkout.
      </p>
    </div>

    <div class="flex flex-col lg:flex-row gap-8 lg:gap-12 items-start">

      <!-- Items Column -->
      <div class="w-full lg:w-7/12 flex-grow">
        <div id="cart-page-items" class="space-y-4">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Order Summary Card -->
      <aside id="cart-page-summary" class="w-full lg:w-5/12 sticky top-28">
        <div class="bg-white rounded-lg border border-[#d3c3bd] p-6 md:p-8 shadow-sm">

          <h3 class="font-serif text-xl font-bold text-[#25160e] border-b border-[#d3c3bd] pb-4 mb-5">
            Order Summary
          </h3>

          <div class="space-y-3 font-sans text-xs md:text-sm text-[#4f4540] mb-6">

            <!-- Subtotal -->
            <div class="flex justify-between">
              <span>Subtotal</span>
              <span id="summary-subtotal" class="font-semibold text-[#1c1b1a]">₹0</span>
            </div>

            <!-- Promo Discount -->
            <div id="summary-discount-row" class="flex justify-between text-[#885210] hidden">
              <span>Promo Discount (<span id="summary-coupon-name"></span>)</span>
              <span id="summary-discount-text">-₹0</span>
            </div>

            <!-- Complimentary Delivery -->
            <div class="flex justify-between items-center">
              <span>Delivery</span>
              <span id="summary-shipping" class="font-semibold text-[#25d366]">
                FREE
              </span>
            </div>

            <!-- Keep the existing JavaScript target without showing a separate tax row -->
            <span id="summary-tax" class="hidden" aria-hidden="true">₹0</span>

          </div>

          <!-- Estimated Total -->
          <div class="border-t border-[#d3c3bd] pt-4 mb-6 flex justify-between items-baseline">
            <span class="font-serif text-base md:text-lg font-bold text-[#25160e]">
              Estimated Total
            </span>
            <span id="summary-total" class="font-serif text-2xl font-bold text-[#25160e]">
              ₹0
            </span>
          </div>

          <!-- Checkout Button -->
          <a href="checkout-step-1.html"
            class="block w-full py-4 bg-[#25160e] text-white text-center font-sans text-xs font-bold tracking-widest uppercase rounded hover:bg-[#3c2a21] transition-colors shadow-sm mb-3">
            Proceed to Checkout
          </a>

          <!-- Continue Shopping -->
          <a href="shop.html"
            class="block w-full py-3 border border-[#25160e] text-[#25160e] text-center font-sans text-xs font-bold tracking-widest uppercase rounded hover:bg-[#25160e]/5 transition-colors">
            Continue Shopping
          </a>

          <!-- Security Note -->
          <div
            class="mt-6 pt-4 border-t border-[#d3c3bd]/50 flex items-center justify-center gap-2 text-[11px] text-[#81756f]">
            <span class="material-symbols-outlined text-sm">lock</span>
            <span>256-bit Encrypted Checkout &amp; Direct WhatsApp Confirmation</span>
          </div>

        </div>
      </aside>
    </div>
  </main>

  <!-- Global Footer -->
  <footer id="site-footer"></footer>

  <!-- Drawer Containers -->
  <div id="cart-drawer-container"></div>
  <div id="mobile-menu-container"></div>
  <div id="search-modal-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
